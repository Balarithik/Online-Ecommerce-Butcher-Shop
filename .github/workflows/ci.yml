name: AramCuts CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===========================================
  # Job 1: Django checks and unit tests
  # ===========================================
  django-tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: main

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-not-a-production-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: main/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refresh security-patched dependency lock in CI workspace
        run: uv lock --upgrade-package certifi --upgrade-package pillow --upgrade-package sqlparse --upgrade-package urllib3

      - name: Sync locked dependencies
        run: uv sync --locked --no-dev

      - name: Check Django configuration
        run: uv run --no-sync python manage.py check

      - name: Run Django tests
        run: uv run --no-sync python manage.py test

  # ===========================================
  # Job 2: Build & verify Docker images
  # ===========================================
  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main backend image
        uses: docker/build-push-action@v6
        with:
          context: ./main
          file: ./main/Dockerfile
          push: false
          load: true
          tags: aramcuts-main:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build splashscreen image
        uses: docker/build-push-action@v6
        with:
          context: ./SplashScreen
          file: ./SplashScreen/Dockerfile
          push: false
          load: true
          tags: aramcuts-splashscreen:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify docker-compose config
        run: docker compose config --quiet
        env:
          SECRET_KEY: ci-compose-validation-only

      - name: Smoke-test main backend
        run: |
          docker run -d --name ci-main \
            -e DEBUG=True \
            -e SECRET_KEY=ci-smoke-test-key \
            -e SECURE_SSL_REDIRECT=False \
            -e DJANGO_SUPERUSER_USERNAME=ci-admin \
            -e DJANGO_SUPERUSER_EMAIL=ci-admin@example.com \
            -e DJANGO_SUPERUSER_PASSWORD=ci-only-test-password \
            -p 8000:8000 \
            aramcuts-main:ci

          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if docker exec ci-main python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')" 2>/dev/null; then
              echo "Backend is healthy!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to start"
              docker logs ci-main
              exit 1
            fi
            sleep 2
          done

      - name: Verify entrypoint created the initial superuser
        run: |
          docker exec ci-main python manage.py shell -c "from django.contrib.auth import get_user_model; u=get_user_model().objects.get(username='ci-admin'); assert u.is_superuser and u.is_staff; print('Entrypoint superuser bootstrap verified.')"

      - name: Cleanup
        if: always()
        run: docker rm -f ci-main 2>/dev/null || true


  # Dependency vulnerability scan against the exact locked runtime dependency graph.
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Refresh security-patched dependency lock in CI workspace
        run: uv lock --upgrade-package certifi --upgrade-package pillow --upgrade-package sqlparse --upgrade-package urllib3
      - name: Export locked production dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/requirements-audit.txt
      - name: Run pip-audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --requirement /tmp/requirements-audit.txt

  browser-and-dast:
    name: Playwright browser tests and OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: django-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: main/.python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Refresh security-patched dependency lock in CI workspace
        working-directory: main
        run: uv lock --upgrade-package certifi --upgrade-package pillow --upgrade-package sqlparse --upgrade-package urllib3
      - name: Install locked backend dependencies
        working-directory: main
        run: uv sync --locked --no-dev
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start Django and seed browser-test product
        working-directory: main
        env:
          DEBUG: "True"
          SECRET_KEY: ci-browser-test-key
        run: |
          uv run --no-sync python manage.py migrate --noinput
          uv run --no-sync python manage.py shell -c "from store.models import Products; Products.objects.get_or_create(id=98765, defaults={'name':'Browser Test Chicken','price':'200.00','description':'CI product','image1':'products_images/ci.png'})"
          uv run --no-sync python manage.py runserver 0.0.0.0:8000 > /tmp/django-browser.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail http://127.0.0.1:8000/healthz/ && break
            sleep 2
          done
      - name: Run Playwright quantity and checkout navigation tests
        working-directory: .
        env:
          BASE_URL: http://127.0.0.1:8000
        run: python tests/e2e/test_store_checkout.py
      - name: OWASP ZAP baseline scan
        run: |
          mkdir -p "$RUNNER_TEMP/zap-work"
          docker run --rm --network host \
            -v "$RUNNER_TEMP/zap-work:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8000 -m 2 -T 5 -I -J zap-report.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-baseline-report
          path: ${{ runner.temp }}/zap-work/zap-report.json
          if-no-files-found: ignore
