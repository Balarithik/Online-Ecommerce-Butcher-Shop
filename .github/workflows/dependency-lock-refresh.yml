name: Refresh dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Resolve security-patched dependencies and commit uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: main/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - name: Refresh patched packages
        working-directory: main
        run: uv lock --upgrade-package certifi --upgrade-package pillow --upgrade-package sqlparse --upgrade-package urllib3
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- main/uv.lock; then
            echo "uv.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/uv.lock
          git commit -m "chore: refresh security-patched dependency lock"
          git push origin HEAD:main
