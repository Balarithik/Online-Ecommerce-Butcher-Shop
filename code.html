<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AramCuts - Splash Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            primary: {
              DEFAULT: '#8b0000',
              dark: '#5c0000',
              light: '#b22222',
            },
            surface: {
              DEFAULT: '#140c0c',
              dark: '#0c0707',
              card: '#1e1414',
            },
            gold: {
              DEFAULT: '#d4af37',
              light: '#f3e5ab',
            }
          },
          animation: {
            'pulse-subtle': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes progress {
      0% { width: 12%; }
      40% { width: 55%; }
      75% { width: 82%; }
      100% { width: 94%; }
    }
    .animate-progress {
      animation: progress 2.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .ambient-glow {
      animation: glow 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#120a0a] text-neutral-100 font-sans min-h-screen flex items-center justify-center p-0 m-0 selection:bg-red-900 selection:text-white antialiased">

  <!-- Mobile Splash Canvas (390px simulated or full mobile screen) -->
  <main class="relative w-full max-w-[420px] min-h-screen bg-gradient-to-b from-[#1c0d0d] via-[#120808] to-[#080404] flex flex-col justify-between items-center px-8 py-12 overflow-hidden shadow-2xl">
    
    <!-- Background Vignette & Ambient Radial Glow -->
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_50%_40%,rgba(139,0,0,0.35),transparent_65%)] ambient-glow"></div>
    <div class="pointer-events-none absolute -top-24 -right-24 w-80 h-80 bg-red-950/40 rounded-full blur-3xl"></div>
    <div class="pointer-events-none absolute -bottom-24 -left-24 w-80 h-80 bg-amber-950/20 rounded-full blur-3xl"></div>

    <!-- Subtle Premium Pattern Overlay -->
    <div class="pointer-events-none absolute inset-0 opacity-[0.03] bg-[radial-gradient(#fff_1px,transparent_1px)] [background-size:16px_16px]"></div>

    <!-- Top Status Bar Area / Tagline -->
    <div class="relative z-10 w-full flex justify-between items-center pt-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/10 backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="text-[10px] uppercase tracking-widest font-semibold text-neutral-300">Farm To Table</span>
      </div>
      <div class="text-[11px] font-medium tracking-wider text-neutral-400 uppercase">
        Artisanal Meats
      </div>
    </div>

    <!-- Center Brand Emblem & Identity -->
    <div class="relative z-10 flex flex-col items-center text-center my-auto w-full">
      
      <!-- Logo Seal Container -->
      <div class="relative mb-7 group">
        <!-- Outer Glow Ring -->
        <div class="absolute -inset-2 rounded-3xl bg-gradient-to-tr from-primary to-amber-700 opacity-40 blur-xl"></div>
        
        <!-- Emblem Box -->
        <div class="relative w-28 h-28 rounded-3xl bg-gradient-to-b from-[#2a1313] to-[#160a0a] border border-white/15 p-1 shadow-2xl flex items-center justify-center">
          <div class="w-full h-full rounded-[20px] bg-gradient-to-br from-[#3b1212] via-[#240909] to-[#140505] flex flex-col items-center justify-center border border-red-500/20 shadow-inner">
            
            <!-- Cleaver & Laurel Icon Motif -->
            <div class="relative flex items-center justify-center">
              <span class="material-symbols-outlined text-4xl text-neutral-100 select-none drop-shadow-[0_2px_8px_rgba(0,0,0,0.8)]">
                restaurant
              </span>
            </div>

            <!-- Est Year -->
            <span class="text-[9px] uppercase tracking-widest text-amber-200/80 font-bold mt-1">
              EST. 2024
            </span>
          </div>
        </div>
      </div>

      <!-- App Title -->
      <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2 font-sans">
        PRIME <span class="text-red-500">CUTS</span>
      </h1>
      
      <!-- Subtitle -->
      <p class="text-xs uppercase tracking-[0.28em] text-neutral-300 font-semibold mb-3">
        Artisanal Butchery &amp; Seafood
      </p>

      <p class="text-xs text-neutral-400 max-w-[240px] leading-relaxed">
        Curating premium grade cuts, sustainably farmed and delivered fresh.
      </p>
    </div>

    <!-- Bottom Loading Section -->
    <div class="relative z-10 w-full flex flex-col items-center gap-4 pb-4">
      
      <!-- Progress Bar Track -->
      <div class="w-full max-w-[260px] flex flex-col gap-2">
        <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden p-[1px] backdrop-blur-sm border border-white/5">
          <div class="h-full bg-gradient-to-r from-red-600 via-red-500 to-amber-400 rounded-full animate-progress shadow-[0_0_12px_rgba(239,68,68,0.7)]"></div>
        </div>
        
        <div class="flex justify-between items-center px-1">
          <span class="text-[11px] font-medium text-neutral-400 tracking-wide flex items-center gap-1.5">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
            Preparing fresh cuts...
          </span>
          <span class="text-[10px] font-bold text-neutral-400 tracking-wider">
            92%
          </span>
        </div>
      </div>

      <!-- Security / Quality Badges -->
      <div class="flex items-center gap-5 pt-3 border-t border-white/5 w-full justify-center">
        <div class="flex items-center gap-1.5 text-neutral-400">
          <span class="material-symbols-outlined text-[15px] text-red-400">verified</span>
          <span class="text-[10px] tracking-wide font-medium">100% Guaranteed</span>
        </div>
        <div class="w-1 h-1 rounded-full bg-neutral-600"></div>
        <div class="flex items-center gap-1.5 text-neutral-400">
          <span class="material-symbols-outlined text-[15px] text-amber-400">electric_bolt</span>
          <span class="text-[10px] tracking-wide font-medium">90-Min Delivery</span>
        </div>
      </div>

    </div>

  </main>
</body>
</html>
